[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vaani-relay"
version = "0.1.0"
description = "Vaani The Relay - Research Paper Q&A pipeline with rate-limit control"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "groq>=0.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
